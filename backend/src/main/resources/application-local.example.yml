# 이 파일을 복사해 application-local.yml을 만들고 값을 채운다. application-local.yml은 Git에 올리지 않는다.
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/freight
    username: freight
    password: <비밀번호>
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: <32바이트 이상 임의 문자열>
  kakao:
    rest-api-key: <키>
