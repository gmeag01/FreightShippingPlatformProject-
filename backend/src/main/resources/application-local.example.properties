# 이 파일을 복사해 application-local.properties를 만들고 <> 부분을 채운다.
# application-local.properties는 Git에 올리지 않는다.
spring.datasource.url=jdbc:mariadb://localhost:3306/freight
spring.datasource.username=freight
spring.datasource.password=<password>
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 32바이트 이상 임의 문자열
app.jwt.secret=<jwt-secret>
app.kakao.rest-api-key=<kakao-rest-api-key>
