spring.application.name=freight
spring.profiles.default=local
spring.jpa.open-in-view=false

# JWT 토큰 시크릿 키 및 유효 시간 (운영 환경에서는 환경변수 JWT_SECRET 필수 주입)
app.jwt.secret=${JWT_SECRET:freight-shipping-platform-jwt-secret-key-at-least-32-bytes}
app.jwt.validity=PT12H
# 설계 문서 3장: 하차 완료 뒤 이 시간 안에 화주가 수령 확인하지 않으면 자동 확인한다. 시연 때는 줄여서 보여 준다.
app.order.auto-confirm-hours=24
# 설계 문서 3장: 자동 확인 스케줄러는 10분마다 돈다.
app.order.auto-confirm-cron=0 */10 * * * *
# 설계 문서 3장: 상차 희망 시각 이 시간 전부터는 차주가 직접 취소할 수 없고 관리자에게 요청해야 한다.
app.order.driver-cancel-cutoff-hours=2
