spring.application.name=freight
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.sql.init.encoding=UTF-8

# JWT 시크릿 키는 저장소에 두지 않는다. application-local.properties의 app.jwt.secret이나 환경변수 APP_JWT_SECRET으로 넣는다.
# JWT 액세스 토큰 유효 시간(밀리초). 30분. 만료되면 프론트가 리프레시 토큰으로 새로 받는다.
app.jwt.validity-ms=1800000
# 리프레시 토큰 유효 시간(밀리초). 14일. 이 기간 안에 다시 접속하면 로그인이 유지된다.
app.jwt.refresh-validity-ms=1209600000
# 토큰 쿠키의 Secure 속성. localhost가 아닌 http 주소로 접속하면 브라우저가 쿠키를 버리므로 그때는 false로 둔다.
app.auth.cookie-secure=true
# 설계 문서 3장: 하차 완료 뒤 이 시간 안에 화주가 수령 확인하지 않으면 자동 확인한다. 시연 때는 줄여서 보여 준다.
app.order.auto-confirm-hours=24
# 설계 문서 3장: 자동 확인 스케줄러는 10분마다 돈다.
app.order.auto-confirm-cron=0 */10 * * * *
# 설계 문서 3장: 상차 희망 시각 이 시간 전부터는 차주가 직접 취소할 수 없고 관리자에게 요청해야 한다.
app.order.driver-cancel-cutoff-hours=2
