spring.datasource.url=jdbc:h2:mem:freight;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

app.jwt.secret=test-secret-key-for-jwt-at-least-32-bytes-long
app.jwt.validity-ms=43200000
app.order.auto-confirm-hours=24
app.order.auto-confirm-cron=-
app.order.driver-cancel-cutoff-hours=2
